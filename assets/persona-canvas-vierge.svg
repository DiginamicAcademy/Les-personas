<rect x="1012" y="490" width="556" height="142" rx="14" fill="#f6f7fb" stroke="#d5d8e3"/><rect x="1012" y="490" width="6" height="142" rx="3" fill="#a16207"/><text x="1036" y="524" font-size="15" font-weight="700" fill="#a16207" letter-spacing="1.5">CANAUX &amp; OUTILS</text>
<circle cx="1041" cy="546.6" r="4" fill="#a16207"/>
<text x="1054" y="552" font-size="15.5" fill="#6b7080" font-weight="normal" font-style="italic">
<tspan x="1054" dy="0.0">Équipements, applications, réseaux qu'elle utilise déjà</tspan>
</text>
<circle cx="1041" cy="573.5" r="4" fill="#a16207"/>
<text x="1054" y="578.925" font-size="15.5" fill="#6b7080" font-weight="normal" font-style="italic">
<tspan x="1054" dy="0.0">Où et comment la toucher</tspan>
</text>
<rect x="1012" y="648" width="556" height="166" rx="14" fill="#f6f7fb" stroke="#d5d8e3"/><rect x="1012" y="648" width="6" height="166" rx="3" fill="#be185d"/><text x="1036" y="682" font-size="15" font-weight="700" fill="#be185d" letter-spacing="1.5">SCÉNARIO CLÉ</text>
<text x="1036" y="712" font-size="15" fill="#6b7080" font-weight="normal" font-style="italic">
<tspan x="1036" dy="0.0">Un moment concret où elle utiliserait le produit : quand, où, avec</tspan>
<tspan x="1036" dy="20.2">quoi, pour quel résultat.</tspan>
</text>
<rect x="32" y="830" width="1536" height="140" rx="14" fill="#eef0ff" stroke="#d5d8e3"/>
<text x="56" y="864" font-size="15" font-weight="700" fill="#3b4cca" letter-spacing="1.5">CE QUE CELA IMPLIQUE POUR LE PRODUIT</text>
<circle cx="61" cy="892.6" r="4" fill="#3b4cca"/>
<text x="74" y="898" font-size="15.5" fill="#6b7080" font-weight="normal" font-style="italic">
<tspan x="74" dy="0.0">Les décisions de conception que cette persona justifie : ce qu'il faut faire, et ce qu'il ne faut pas faire.</tspan>
</text>
<circle cx="61" cy="917.5" r="4" fill="#3b4cca"/>
<text x="74" y="922.925" font-size="15.5" fill="#6b7080" font-weight="normal" font-style="italic">
<tspan x="74" dy="0.0">Chaque ligne doit pouvoir se relier à un objectif ou à une frustration ci-dessus.</tspan>
</text>
</svg>
